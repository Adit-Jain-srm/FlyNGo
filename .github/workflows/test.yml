name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        run: python -m pytest backend/tests -q
